<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ayeshlyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007FFF"/>
      <stop offset="60%" stop-color="#007FFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle in Deep Blue #0A1128 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0A1128" stroke="#007FFF" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>

  <!-- Left arm -->
  <path d="M 32 18 L 18 46" stroke="url(#ayeshlyBlue)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Right arm -->
  <path d="M 32 18 L 46 46" stroke="url(#ayeshlyBlue)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Apex Blue Dot -->
  <circle cx="32" cy="18" r="3.5" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="32" cy="18" r="1.5" fill="#FFFFFF"/>
</svg>
