<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <defs>
    <linearGradient id="icon-grad" x1="16" y1="42" x2="44" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E5BFF"/>
      <stop offset="55%" stop-color="#007FFF"/>
      <stop offset="100%" stop-color="#FF5FB8"/>
    </linearGradient>
    <filter id="icon-glow" x="0" y="0" width="60" height="60" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="6" y="6" width="48" height="48" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="6.75" y="6.75" width="46.5" height="46.5" rx="13.25" stroke="url(#icon-grad)" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Inverted V Symbol -->
  <path d="M19 39 L30 19 L41 39" 
        stroke="url(#icon-grad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Glowing Apex Node -->
  <circle cx="30" cy="19" r="2.2" fill="#00F0FF" filter="url(#icon-glow)"/>
  <circle cx="30" cy="19" r="1.4" fill="#FFFFFF"/>
</svg>
